name: Techman Reef OTA - GitHub only
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - ".github/workflows/ota-publish.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ota-production
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safety guard against publishing test firmware
        run: |
          grep -q 'RF24 radio' src/main.cpp
          test "$(wc -l < src/main.cpp)" -gt 1000
          grep -q 'TECHMAN_OTA_BASE_URL' src/main.cpp || { echo 'El cliente OTA GitHub aun no esta integrado; no publicar.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ESP8266
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          export PLATFORMIO_BUILD_FLAGS="-DTECHMAN_FW_VERSION=\\\"$VERSION\\\" -DTECHMAN_OTA_BASE_URL=\\\"https://raw.githubusercontent.com/sergi0689/Techmanreef/ota\\\""
          pio run -e nodemcuv2
      - name: Publish firmware and manifest to ota branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/techman-ota
          cp .pio/build/nodemcuv2/firmware.bin /tmp/techman-ota/firmware.bin
          printf '%s\n' "${GITHUB_SHA:0:12}" > /tmp/techman-ota/manifest.txt
          cd /tmp/techman-ota
          git init
          git checkout -b ota
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "OTA ${GITHUB_SHA:0:12}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin ota
