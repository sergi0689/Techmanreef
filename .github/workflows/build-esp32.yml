name: Compilar firmware ESP32 (prueba)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: PlatformIO / ESP32 genérico
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: python -m pip install 'platformio==6.1.18'

      - name: Compilar ESP32
        run: pio run -e esp32dev

      - name: Guardar BIN de prueba (NO FLASHEAR)
        uses: actions/upload-artifact@v4
        with:
          name: Techmanreef-ESP32-BASE-NO-FLASH
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error
          retention-days: 7
